<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM Forecast - Advanced Price Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #e8e6e3;
            overflow-x: hidden;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffffff;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 48px 80px;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 70% 50%, rgba(30, 30, 45, 0.5) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-text {
            max-width: 560px;
        }

        .hero-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 24px;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 4.5rem;
            font-weight: 300;
            line-height: 1.1;
            color: #ffffff;
            margin-bottom: 32px;
            letter-spacing: -0.01em;
        }

        .hero-title em {
            font-style: italic;
            font-weight: 300;
        }

        .hero-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6em;
            font-weight: 300;
            font-style: italic;
            color: rgba(232, 230, 227, 0.45);
            letter-spacing: 0.04em;
            margin-bottom: 48px;
            max-width: 420px;
        }

        /* Forecast Panel */
        .forecast-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            padding: 48px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .panel-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        .panel-badge {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 1px;
        }

        /* Form Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group.full-width {
            grid-column: 1 / -1;
        }

        .control-group label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 10px;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
        }

        .control-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .control-group select option {
            background: #0a0a0a;
            color: #ffffff;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px 32px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            border-radius: 1px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Decorative Line */
        .divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 0 auto 48px;
        }

        /* Backtest Styles */
        .bt-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .bt-control {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            padding: 10px 12px;
        }

        .bt-control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bt-control-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .bt-control-value {
            font-size: 0.7rem;
            font-weight: 500;
            color: #e8e6e3;
        }

        .bt-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .bt-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .bt-level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 24px;
        }

        .bt-level-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .bt-level-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .bt-level-card.selected {
            background: rgba(255, 255, 255, 0.04);
        }

        .bt-level-price {
            font-size: 0.85rem;
            font-weight: 500;
            color: #ffffff;
        }

        .bt-level-score {
            font-size: 0.75rem;
            font-weight: 500;
        }

        .bt-level-meta {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            margin: 4px 0;
        }

        .bt-score-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            overflow: hidden;
        }

        .bt-score-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .bt-detail {
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .bt-detail-header {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .bt-detail-price {
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffffff;
        }

        .bt-badge {
            font-size: 0.55rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .bt-detail-meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-left: auto;
        }

        .bt-detail-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .bt-detail-left {
            padding: 18px;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        .bt-detail-right {
            padding: 18px;
        }

        .bt-section-label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .bt-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .bt-stat-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .bt-stat-value {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .bt-stat-sub {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            margin-left: 4px;
        }

        .bt-gauges {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .bt-gauge-label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            max-width: 70px;
        }

        .bt-regime-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .bt-regime-label {
            width: 52px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
        }

        .bt-regime-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .bt-regime-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .bt-regime-pct {
            width: 36px;
            font-size: 0.65rem;
            color: #e8e6e3;
            text-align: right;
        }

        .bt-regime-count {
            width: 28px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .bt-interp {
            font-size: 0.7rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.4);
        }

        .bt-footer {
            margin-top: 12px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            text-align: right;
        }

        @media (max-width: 768px) {
            .bt-detail-body {
                grid-template-columns: 1fr;
            }
            .bt-detail-left {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 48px;
            }

            .hero-title {
                font-size: 3rem;
            }

            .nav {
                padding: 20px 24px;
            }

            .hero {
                padding: 120px 24px 60px;
            }
        }

        @media (max-width: 640px) {
            .hero-title {
                font-size: 2.2rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

            .forecast-panel {
                padding: 32px 24px;
            }
        }
    </style>
</head>

        function detectRegimes(data) {
            const smaLen = 50;
            for (let i = 0; i < data.length; i++) {
                if (i < smaLen) { data[i].regime = 'sideways'; continue; }
                const slice = data.slice(i - smaLen, i);
                const sma = slice.reduce((s, d) => s + d.close, 0) / smaLen;
                const prevSma = slice.slice(0, -1).reduce((s, d) => s + d.close, 0) / (smaLen - 1);
                const diff = (sma - prevSma) / prevSma;
                data[i].regime = diff > 0.001 ? 'bull' : diff < -0.001 ? 'bear' : 'sideways';
            }
            return data;

        function detectSupportLevels(data, lookback = 20, strength = 2) {

            let broken = false;

            // For auto-detected levels, start AFTER detection to avoid in-sample contamination
            // For manual levels (evalStart=0), scan the full dataset
            const startIdx = evalStart !== null ? evalStart : firstIdx + 1;

            for (let i = startIdx; i < data.length; i++) {
                const bar = data[i];
                if (Math.abs(bar.low - price) <= tolerance || (bar.low < price && bar.close > price - tolerance)) {
                    const window = data.slice(Math.max(0, i - 20), i);
                    const avgVol = window.length > 0 ? window.reduce((s, b) => s + b.volume, 0) / window.length : 1;
                    const bounced = i + 5 < data.length && data[i + 5].close > price * (1 + bounceThreshold);
                    touches.push({ idx: i, regime: bar.regime, bounced, volRatio: bar.volume / avgVol });
                    if (bar.low < price - tolerance && bar.close > price - tolerance * 2) {
                        falseBreakouts++;
                    }
                }
                if (bar.close < price * 0.985 && i > startIdx + 5 && !broken) {
                    broken = true;
                    validUntil = i;
                }

            const bounceRate = touches.length > 0 ? touches.filter(t => t.bounced).length / touches.length : 0;
            const allPrices = data.map(d => d.close).sort((a, b) => a - b);
            const pricePercentile = allPrices.filter(p => p < price).length / allPrices.length * 100;
            const volumeConfirmed = touches.filter(t => t.volRatio > 1.2).length;
            const volConfirmRate = touches.length > 0 ? volumeConfirmed / touches.length : 0;

            const byRegime = { bull: { total: 0, bounce: 0 }, bear: { total: 0, bounce: 0 }, sideways: { total: 0, bounce: 0 } };
            touches.forEach(t => { byRegime[t.regime].total++; if (t.bounced) byRegime[t.regime].bounce++; });

            return {

                byRegime, duration: validUntil - startIdx, broken, falseBreakouts,

            const maxP = Math.max(...prices) * 1.02;
            const scaleX = (i) => (i / (data.length - 1)) * (width - 8) + 4;
            const scaleY = (p) => height - 4 - ((p - minP) / (maxP - minP)) * (height - 8);

            const regColors = { bull: 'rgba(34,197,94,0.07)', bear: 'rgba(239,68,68,0.07)', sideways: 'rgba(148,163,184,0.07)' };

            btResults.sort((a, b) => parseFloat(scoreLevel(b)) - parseFloat(scoreLevel(a)));

            if (btSelectedIdx >= btResults.length) btSelectedIdx = 0;
            const sel = btResults[btSelectedIdx];

            const interval = document.getElementById('bt-interval').value;
            const tfLabels = {'5m':'5min','15m':'15min','1h':'1H','4h':'4H','1d':'Daily','1wk':'Weekly'};
            const tfLabel = tfLabels[interval] || interval;

            let html = `
                <div class="bt-controls">
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">Bounce threshold</span>
                            <span class="bt-control-value" id="bt-thresh-val">${(btBounceThreshold * 100).toFixed(1)}%</span>
                        </div>
                        <input type="range" class="bt-slider" id="bt-thresh" min="0.005" max="0.03" step="0.005" value="${btBounceThreshold}">
                    </div>
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">Timeframe</span>
                            <span class="bt-control-value">${tfLabel}</span>
                        </div>
                    </div>
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">Levels tested</span>
                            <span class="bt-control-value">${levels.length}</span>
                        </div>
                    </div>
                </div>`;

            html += '<div class="bt-level-grid">';
            btResults.forEach((r, i) => {
                const score = parseFloat(scoreLevel(r));
                const sc = score >= 65 ? BT_COLORS.green : score >= 45 ? BT_COLORS.amber : BT_COLORS.red;
                html += `
                    <div class="bt-level-card ${btSelectedIdx === i ? 'selected' : ''}" data-bt-idx="${i}" style="${btSelectedIdx === i ? 'border-color:' + sc : ''}">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                            <span class="bt-level-price">$${r.price.toFixed(2)}</span>
                            <span class="bt-level-score" style="color:${sc}">${score}</span>
                        </div>
                        <div class="bt-level-meta">${r.touches} touches &middot; ${r.broken ? 'broken' : 'active'}</div>
                        <div class="bt-score-bar"><div class="bt-score-fill" style="width:${score}%;background:${sc}"></div></div>
                    </div>`;
            });
            html += '</div>';

            if (sel) {
                const brColor = sel.broken ? BT_COLORS.red : BT_COLORS.green;
                html += `
                <div class="bt-detail">
                    <div class="bt-detail-header">
                        <span class="bt-detail-price">$${sel.price.toFixed(2)}</span>
                        <span class="bt-badge" style="border:1px solid ${brColor};color:${brColor}">${sel.broken ? 'BROKEN' : 'ACTIVE'}</span>
                        <span class="bt-badge" style="border:1px solid ${BT_COLORS.blue};color:${BT_COLORS.blue}">SCORE ${scoreLevel(sel)}</span>
                        <span class="bt-detail-meta">${sel.touches} total touches &middot; eval'd ${sel.evalBars} bars &middot; valid ${sel.duration} bars &middot; ${sel.falseBreakouts} false breakout${sel.falseBreakouts !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="bt-detail-body">
                        <div class="bt-detail-left">
                            <canvas id="bt-mini-chart" style="width:100%;max-width:320px"></canvas>
                            <div style="margin-top:16px">
                                <div class="bt-section-label">CORE METRICS</div>
                                <div class="bt-stat-row">
                                    <span class="bt-stat-label">Bounce accuracy</span>
                                    <span class="bt-stat-value" style="color:${qualityColor(sel.bounceRate, 0.4, 0.65)}">${(sel.bounceRate * 100).toFixed(1)}%<span class="bt-stat-sub">(&ge;${(btBounceThreshold * 100).toFixed(1)}% move)</span></span>
                                </div>
                                <div class="bt-stat-row">
                                    <span class="bt-stat-label">Price percentile</span>
                                    <span class="bt-stat-value" style="color:${sel.pricePercentile >= 5 && sel.pricePercentile <= 35 ? BT_COLORS.green : 'rgba(255,255,255,0.4)'}">${sel.pricePercentile.toFixed(1)}%<span class="bt-stat-sub">in price dist.</span></span>
                                </div>
                                <div class="bt-stat-row">
                                    <span class="bt-stat-label">Vol confirmation</span>
                                    <span class="bt-stat-value" style="color:${qualityColor(sel.volConfirmRate, 0.35, 0.55)}">${(sel.volConfirmRate * 100).toFixed(1)}%<span class="bt-stat-sub">above-avg vol at touch</span></span>
                                </div>
                                <div class="bt-stat-row">
                                    <span class="bt-stat-label">False breakout rate</span>
                                    <span class="bt-stat-value" style="color:${sel.falseBreakoutRate < 0.15 ? BT_COLORS.green : sel.falseBreakoutRate < 0.3 ? BT_COLORS.amber : BT_COLORS.red}">${(sel.falseBreakoutRate * 100).toFixed(1)}%</span>
                                </div>
                                <div class="bt-stat-row">
                                    <span class="bt-stat-label">Level duration</span>
                                    <span class="bt-stat-value" style="color:${sel.duration > 100 ? BT_COLORS.green : sel.duration > 50 ? BT_COLORS.amber : BT_COLORS.red}">${sel.duration} bars</span>
                                </div>
                            </div>
                        </div>
                        <div class="bt-detail-right">
                            <div class="bt-section-label">SIGNAL GAUGES</div>
                            <div class="bt-gauges">
                                ${createGaugeSVG(sel.bounceRate, 'bounce rate', qualityColor(sel.bounceRate, 0.4, 0.65))}
                                ${createGaugeSVG(sel.volConfirmRate, 'vol confirm', qualityColor(sel.volConfirmRate, 0.35, 0.55))}
                                ${createGaugeSVG(1 - sel.falseBreakoutRate, 'reliability', qualityColor(1 - sel.falseBreakoutRate, 0.7, 0.85))}
                            </div>
                            <div class="bt-section-label" style="margin-top:16px">REGIME ROBUSTNESS</div>
                            ${[{key:'bull',label:'bull',color:BT_COLORS.green},{key:'bear',label:'bear',color:BT_COLORS.red},{key:'sideways',label:'sideways',color:BT_COLORS.amber}].map(({key,label,color}) => {
                                const r = sel.byRegime[key];
                                const rate = r.total > 0 ? r.bounce / r.total : 0;
                                return `<div class="bt-regime-row">
                                    <span class="bt-regime-label">${label}</span>
                                    <div class="bt-regime-bar"><div class="bt-regime-fill" style="width:${rate * 100}%;background:${color}"></div></div>
                                    <span class="bt-regime-pct">${r.total > 0 ? (rate * 100).toFixed(0) + '%' : '—'}</span>
                                    <span class="bt-regime-count">(${r.total})</span>
                                </div>`;
                            }).join('')}
                            <div style="margin-top:16px">
                                <div class="bt-section-label">INTERPRETATION</div>
                                <div class="bt-interp">
                                    ${sel.bounceRate >= 0.65 ? 'Strong bounce accuracy — high confidence level. ' : ''}
                                    ${sel.bounceRate < 0.4 ? 'Weak bounce rate — exercise caution. ' : ''}
                                    ${sel.pricePercentile >= 5 && sel.pricePercentile <= 35 ? 'Price sits in ideal support zone. ' : ''}
                                    ${sel.volConfirmRate >= 0.5 ? 'Volume confirms institutional interest. ' : ''}
                                    ${sel.falseBreakoutRate > 0.25 ? 'High false breakout frequency — widen stops. ' : ''}
                                    ${sel.byRegime.bear.total > 0 && sel.byRegime.bear.bounce / sel.byRegime.bear.total > 0.5 ? 'Holds well in bear regime — robust level. ' : ''}
                                    ${sel.duration > 100 ? 'Long-lived level — structurally significant.' : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            html += `<div class="bt-footer">yfinance OHLCV &middot; ${btData.length} bars &middot; ${tfLabel} &middot; ${levels.length} level${levels.length !== 1 ? 's' : ''} tested &middot; auto-detected regimes</div>`;
            container.innerHTML = html;

            // Draw mini chart
            if (sel) {
                const chartCanvas = document.getElementById('bt-mini-chart');
                if (chartCanvas) drawMiniChart(chartCanvas, btData, sel.price);
            }

            // Bind slider events
            const threshSlider = document.getElementById('bt-thresh');

            if (threshSlider) threshSlider.addEventListener('input', (e) => {
                btBounceThreshold = parseFloat(e.target.value);
                document.getElementById('bt-thresh-val').textContent = (btBounceThreshold * 100).toFixed(1) + '%';
                btSelectedIdx = 0;
                renderBacktestResults();
            });

            // Bind level card clicks
            document.querySelectorAll('.bt-level-card').forEach(card => {
                card.addEventListener('click', () => {
                    btSelectedIdx = parseInt(card.dataset.btIdx);
                    renderBacktestResults();
                });
            });
        }

        // Backtest button handler
        document.getElementById('runBacktest').addEventListener('click', async () => {
            const levelStr = document.getElementById('bt-level').value.trim();
            const ticker = document.getElementById('bt-ticker').value.trim();
            const period = document.getElementById('bt-period').value;
            const interval = document.getElementById('bt-interval').value;
            const btBtn = document.getElementById('runBacktest');
            const btContainer = document.getElementById('backtestContainer');

            if (!levelStr) { alert('Enter at least one price level to test'); return; }
            if (!ticker) { alert('Please enter a ticker symbol'); return; }

            btBtn.disabled = true;
            const parsedLevels = levelStr.split(',').map(s => parseFloat(s.trim())).filter(p => !isNaN(p) && p > 0);
            btContainer.innerHTML = `<div class="loading"><div class="spinner"></div><p>Testing ${parsedLevels.length} level${parsedLevels.length !== 1 ? 's' : ''} on ${interval} data...</p></div>`;

            try {
                const url = new URL('https://fartpie.onrender.com/api/backtest-data');
                url.searchParams.set('ticker', ticker);
                url.searchParams.set('period', period);
                url.searchParams.set('interval', interval);

                const response = await fetch(url.toString());
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || `HTTP ${response.status}`);
                }

                const result = await response.json();
                btData = detectRegimes(result.data);
                btSelectedIdx = 0;
                renderBacktestResults();
            } catch (error) {
                btContainer.innerHTML = `<div class="lstm-forecast-error"><h3>Error</h3><p>${error.message}</p></div>`;
            } finally {
                btBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
