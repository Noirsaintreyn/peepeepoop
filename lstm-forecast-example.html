<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSTM Forecast - Advanced Price Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #0a0e1a;
            color: #e8e6e3;
            overflow-x: hidden;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 48px;
            background: rgba(10, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(201, 162, 39, 0.12);
        }

        .nav-brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #c9a227;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.5);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #c9a227;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 48px 80px;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 70% 50%, rgba(10, 14, 26, 0.5) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-text {
            max-width: 560px;
        }

        .hero-label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 24px;
        }

        .hero-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 4.5rem;
            font-weight: 300;
            line-height: 1.1;
            color: #ffffff;
            margin-bottom: 32px;
            letter-spacing: -0.01em;
        }

        .hero-title em {
            font-style: italic;
            font-weight: 300;
        }

        .hero-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6em;
            font-weight: 300;
            font-style: italic;
            color: rgba(232, 230, 227, 0.45);
            letter-spacing: 0.04em;
            margin-bottom: 48px;
            max-width: 420px;
        }

        /* Forecast Panel */
        .forecast-panel {
            background: rgba(201, 162, 39, 0.03);
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-radius: 2px;
            padding: 48px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.12);
        }

        .panel-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.5rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.02em;
        }

        .panel-badge {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.5);
            border: 1px solid rgba(201, 162, 39, 0.2);
            padding: 6px 14px;
            border-radius: 1px;
        }

        /* Form Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group.full-width {
            grid-column: 1 / -1;
        }

        .control-group label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.5);
            margin-bottom: 10px;
        }

        .control-group input,
        .control-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(201, 162, 39, 0.04);
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-radius: 1px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
        }

        .control-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .control-group select option {
            background: #0a0e1a;
            color: #ffffff;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: rgba(201, 162, 39, 0.4);
        }

        .btn {
            width: 100%;
            padding: 16px 32px;
            background: transparent;
            border: 1px solid rgba(201, 162, 39, 0.3);
            color: #c9a227;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            border-radius: 1px;
        }

        .btn:hover {
            background: rgba(201, 162, 39, 0.08);
            border-color: rgba(201, 162, 39, 0.5);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-top: 1px solid rgba(201, 162, 39, 0.6);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Decorative Line */
        .divider {
            width: 60px;
            height: 1px;
            background: rgba(201, 162, 39, 0.3);
            margin: 0 auto 48px;
        }

        /* Backtest Styles */
        .bt-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .bt-control {
            background: rgba(201, 162, 39, 0.04);
            border-radius: 4px;
            padding: 10px 12px;
        }

        .bt-control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bt-control-label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .bt-control-value {
            font-size: 0.7rem;
            font-weight: 500;
            color: #e8e6e3;
        }

        .bt-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(201, 162, 39, 0.12);
            outline: none;
        }

        .bt-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .bt-level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 24px;
        }

        .bt-level-card {
            background: rgba(201, 162, 39, 0.03);
            border: 1px solid rgba(201, 162, 39, 0.12);
            border-radius: 4px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .bt-level-card:hover {
            border-color: rgba(201, 162, 39, 0.3);
        }

        .bt-level-card.selected {
            background: rgba(201, 162, 39, 0.05);
        }

        .bt-level-price {
            font-size: 0.85rem;
            font-weight: 500;
            color: #ffffff;
        }

        .bt-level-score {
            font-size: 0.75rem;
            font-weight: 500;
        }

        .bt-level-meta {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            margin: 4px 0;
        }

        .bt-score-bar {
            height: 3px;
            background: rgba(201, 162, 39, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .bt-score-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .bt-detail {
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-radius: 4px;
            overflow: hidden;
        }

        .bt-detail-header {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.12);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .bt-detail-price {
            font-size: 1.2rem;
            font-weight: 500;
            color: #ffffff;
        }

        .bt-badge {
            font-size: 0.55rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .bt-detail-meta {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            margin-left: auto;
        }

        .bt-detail-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .bt-detail-left {
            padding: 18px;
            border-right: 1px solid rgba(201, 162, 39, 0.12);
        }

        .bt-detail-right {
            padding: 18px;
        }

        .bt-section-label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .bt-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 5px 0;
            border-bottom: 1px solid rgba(201, 162, 39, 0.08);
        }

        .bt-stat-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .bt-stat-value {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .bt-stat-sub {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.25);
            margin-left: 4px;
        }

        .bt-gauges {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .bt-gauge-label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            max-width: 70px;
        }

        .bt-regime-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .bt-regime-label {
            width: 52px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
        }

        .bt-regime-bar {
            flex: 1;
            height: 8px;
            background: rgba(201, 162, 39, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .bt-regime-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .bt-regime-pct {
            width: 36px;
            font-size: 0.65rem;
            color: #e8e6e3;
            text-align: right;
        }

        .bt-regime-count {
            width: 28px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .bt-interp {
            font-size: 0.7rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.4);
        }

        .bt-footer {
            margin-top: 12px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            text-align: right;
        }

        @media (max-width: 768px) {
            .bt-detail-body {
                grid-template-columns: 1fr;
            }
            .bt-detail-left {
                border-right: none;
                border-bottom: 1px solid rgba(201, 162, 39, 0.12);
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-content {
                grid-template-columns: 1fr;
                gap: 48px;
            }

            .hero-title {
                font-size: 3rem;
            }

            .nav {
                padding: 20px 24px;
            }

            .hero {
                padding: 120px 24px 60px;
            }
        }

        @media (max-width: 640px) {
            .hero-title {
                font-size: 2.2rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .nav-links {
                display: none;
            }

            .forecast-panel {
                padding: 32px 24px;
            }
        }

        /* NHP Section (left side, below hero text) */
        .nhp-section {
            margin-top: 32px;
            padding: 20px;
            background: rgba(201, 162, 39, 0.03);
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-radius: 2px;
            max-width: 560px;
        }
        .nhp-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.12);
        }
        .nhp-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: #fff;
        }
        .nhp-status-badge {
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 3px 8px;
            margin-left: 12px;
        }
        .nhp-bars-label {
            font-size: 0.6rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.5);
        }
        .nhp-intensity-chart {
            width: 100%;
            height: 160px;
            position: relative;
            margin: 16px 0;
            border: 1px solid rgba(201, 162, 39, 0.12);
            border-radius: 2px;
            background: rgba(10, 14, 26, 0.5);
        }
        .nhp-intensity-chart canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .nhp-summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: rgba(201, 162, 39, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 12px;
        }
        .nhp-summary-grid .metric {
            text-align: center;
            padding: 14px 8px;
            background: #0a0e1a;
        }
        .nhp-summary-grid .metric-label {
            font-size: 0.55rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.5);
            margin-bottom: 6px;
        }
        .nhp-summary-grid .metric-value {
            font-size: 0.9rem;
            font-weight: 500;
            color: #e8e6e3;
        }
        .nhp-signals-list {
            margin-top: 16px;
        }
        .nhp-signal-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(201, 162, 39, 0.06);
            font-size: 0.75rem;
        }
        .nhp-signal-tag {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            border-radius: 2px;
        }
        .nhp-signal-tag.enter { background: rgba(111, 207, 151, 0.15); color: #6fcf97; }
        .nhp-signal-tag.exit { background: rgba(235, 87, 87, 0.15); color: #eb5757; }
        .nhp-signal-tag.hold { background: rgba(201, 162, 39, 0.1); color: rgba(201, 162, 39, 0.5); }
        .nhp-stat { color: rgba(255, 255, 255, 0.4); font-size: 0.7rem; }

        /* Login Page */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: #0a0e1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            width: 100%;
            max-width: 380px;
            padding: 48px;
            background: rgba(201, 162, 39, 0.03);
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-radius: 2px;
        }
        .login-brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2rem;
            font-weight: 300;
            color: #c9a227;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-style: italic;
            color: rgba(201, 162, 39, 0.4);
            text-align: center;
            margin-bottom: 36px;
        }
        .login-box .control-group {
            margin-bottom: 20px;
        }
        .login-box .control-group label {
            display: block;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(201, 162, 39, 0.5);
            margin-bottom: 10px;
        }
        .login-box .control-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(201, 162, 39, 0.04);
            border: 1px solid rgba(201, 162, 39, 0.15);
            border-radius: 1px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .login-box .control-group input:focus {
            outline: none;
            border-color: rgba(201, 162, 39, 0.4);
        }
        .login-error {
            font-size: 0.75rem;
            color: #eb5757;
            text-align: center;
            margin-bottom: 16px;
            min-height: 1.2em;
        }
        .login-btn {
            width: 100%;
            padding: 16px 32px;
            background: transparent;
            border: 1px solid rgba(201, 162, 39, 0.3);
            color: #c9a227;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            border-radius: 1px;
        }
        .login-btn:hover {
            background: rgba(201, 162, 39, 0.08);
            border-color: rgba(201, 162, 39, 0.5);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <div class="login-brand">L'argent parle.</div>
            <div class="login-tagline">Nous traduisons.</div>
            <div class="control-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" placeholder="Enter username" autocomplete="username">
            </div>
            <div class="control-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
            </div>
            <div class="login-error" id="loginError"></div>
            <button class="login-btn" id="loginBtn">Sign In</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-brand">L'argent parle.</div>
        <ul class="nav-links">
            <li><a href="#" class="active" data-tab="forecast">Forecast</a></li>
            <li><a href="#" data-tab="backtest">Backtest</a></li>
            <li><a href="#" data-tab="analysis">Analysis</a></li>
            <li><a href="#" data-tab="levels">Levels</a></li>
            <li><a href="#" data-tab="models">Models</a></li>
        </ul>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">L'argent parle.</h1>
                <p class="hero-desc">Nous traduisons.</p>
                <div class="divider" style="margin: 0;"></div>
                <div id="nhpContainer"></div>
            </div>

            <div class="forecast-panel">
                <div class="panel-header">
                    <div class="panel-title">Run Forecast</div>
                    <div class="panel-badge">Live</div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="ticker">Ticker</label>
                        <input type="text" id="ticker" value="SPY" placeholder="SPY, NQ=F, etc.">
                    </div>
                    <div class="control-group">
                        <label for="timeframe">Timeframe</label>
                        <select id="timeframe">
                            <option value="1m">1 Minute</option>
                            <option value="5m" selected>5 Minutes</option>
                            <option value="15m">15 Minutes</option>
                            <option value="1h">1 Hour</option>
                            <option value="4h">4 Hours</option>
                            <option value="1d">1 Day</option>
                        </select>
                    </div>

                    <div class="control-group full-width">
                        <button class="btn" id="getForecast">Get Forecast</button>
                    </div>
                </div>

                <div id="forecastContainer"></div>
            </div>

            <!-- Backtest Panel -->
            <div class="forecast-panel backtest-panel" id="backtestPanel" style="display: none;">
                <div class="panel-header">
                    <div class="panel-title">Level Detection Backtest</div>
                    <div class="panel-badge">yfinance</div>

        document.head.appendChild(styleEl);

        class LSTMForecast {
            constructor(apiBaseUrl = 'https://fartpie.onrender.com', authToken = null) {
                this.apiBaseUrl = apiBaseUrl;
                this.authToken = authToken;
            }

            async getForecast(ticker, timeframe = '5m', lookback = 20) {
                const url = new URL(`${this.apiBaseUrl}/api/lstm-forecast`);
                url.searchParams.set('ticker', ticker);
                url.searchParams.set('timeframe', timeframe);
                url.searchParams.set('lookback', lookback.toString());

                const headers = { 'Content-Type': 'application/json' };
                if (this.authToken) {
                    headers['Authorization'] = `Bearer ${this.authToken}`;
                }

                const maxRetries = 3;
                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    try {
                        const controller = new AbortController();
                        const timeout = setTimeout(() => controller.abort(), 60000);
                        const response = await fetch(url.toString(), {
                            method: 'GET',
                            headers: headers,
                            credentials: 'include',
                            signal: controller.signal
                        });
                        clearTimeout(timeout);

                        if (!response.ok) {
                            if (response.status >= 500 && attempt < maxRetries - 1) {
                                await new Promise(r => setTimeout(r, 3000));
                                continue;
                            }
                            const error = await response.json();
                            throw new Error(error.error || `HTTP ${response.status}`);
                        }

                        return await response.json();
                    } catch (error) {
                        if (attempt === maxRetries - 1) {
                            console.error('LSTM Forecast Error:', error);
                            throw error;
                        }
                        await new Promise(r => setTimeout(r, 3000));
                    }
                }
            }

            formatForecast(forecastData) {
                if (!forecastData.success) {
                    return {
                        error: forecastData.error,
                        suggestion: forecastData.suggestion || null
                    };
                }

                const answer = forecastData.answer;
                const bounds = forecastData.theoretical_bounds;
                const levels = forecastData.levels_detected;

                return {
                    question: forecastData.question,
                    target: {
                        price: answer.target_price,
                        move: answer.target_pct_move,
                        moveFormatted: `${answer.target_pct_move >= 0 ? '+' : ''}${answer.target_pct_move.toFixed(2)}%`,
                        confidence: answer.confidence,
                        confidenceFormatted: `${(answer.confidence * 100).toFixed(1)}%`,
                        timeMinutes: answer.expected_time_minutes,
                        timeBars: answer.expected_time_bars,
                        timeFormatted: this.formatTime(answer.expected_time_minutes)
                    },
                    closestLevel: answer.closest_level,
                    attention: answer.attention_focus,
                    bounds: {
                        hod1std: bounds.hod_1std,
                        lod1std: bounds.lod_1std,
                        hod2std: bounds.hod_2std,
                        lod2std: bounds.lod_2std,
                        hod3std: bounds.hod_3std,
                        lod3std: bounds.lod_3std,
                        hodPM: bounds.hod_premarket,
                        lodPM: bounds.lod_premarket,
                        hodID: bounds.hod_intraday,
                        lodID: bounds.lod_intraday
                    },
                    levels: levels,
                    allLevels: forecastData.all_levels || [],
                    currentPrice: answer.target_price / (1 + answer.target_pct_move / 100),
                    modelUsed: forecastData.model_used
                };
            }

            formatTime(minutes) {
                if (minutes < 60) {
                    return `${Math.round(minutes)} minutes`;
                } else if (minutes < 1440) {
                    const hours = Math.floor(minutes / 60);
                    const mins = Math.round(minutes % 60);
                    return mins > 0 ? `${hours}h ${mins}m` : `${hours} hours`;
                } else {
                    const days = Math.floor(minutes / 1440);
                    const hours = Math.floor((minutes % 1440) / 60);
                    return hours > 0 ? `${days}d ${hours}h` : `${days} days`;
                }
            }

            renderForecast(formattedData, container) {
                if (formattedData.error) {
                    container.innerHTML = `
                        <div class="lstm-forecast-error">
                            <h3>Forecast Error</h3>
                            <p>${formattedData.error}</p>
                            ${formattedData.suggestion ? `<p class="suggestion">${formattedData.suggestion}</p>` : ''}
                        </div>
                    `;
                    return;
                }

                const target = formattedData.target;
                const isUp = target.move >= 0;
                const confidenceColor = target.confidence > 0.7 ? '#6fcf97' : target.confidence > 0.5 ? '#f2c94c' : '#eb5757';

                container.innerHTML = `
                    <div class="lstm-forecast-container">
                        <div class="lstm-forecast-header">
                            <h3>${formattedData.question}</h3>
                            <span class="model-badge">${formattedData.modelUsed}</span>
                        </div>

                        <div class="lstm-forecast-target">
                            <div class="target-price">
                                <div class="target-label">Target Price</div>
                                <div class="target-value">$${target.price.toFixed(2)}</div>
                                <div class="target-move ${isUp ? 'up' : 'down'}">
                                    ${target.moveFormatted}
                                </div>
                            </div>

                            <div class="target-metrics">
                                <div class="metric">
                                    <div class="metric-label">Confidence</div>
                                    <div class="metric-value" style="color: ${confidenceColor}">
                                        ${target.confidenceFormatted}
                                    </div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Expected Time</div>
                                    <div class="metric-value">${target.timeFormatted}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Time (Bars)</div>
                                    <div class="metric-value">${target.timeBars}</div>
                                </div>
                            </div>
                        </div>

                        ${formattedData.closestLevel ? `
                            <div class="lstm-forecast-level">
                                <div class="level-label">Closest Level</div>
                                <div class="level-info">
                                    <span class="level-price">$${formattedData.closestLevel.price?.toFixed(2) || 'N/A'}</span>
                                    ${formattedData.closestLevel.strength ? `
                                        <span class="level-strength">Strength: ${(formattedData.closestLevel.strength * 100).toFixed(0)}%</span>
                                    ` : ''}
                                </div>
                            </div>
                        ` : ''}

                        <div class="lstm-forecast-bounds">
                            <div class="bounds-header">Theoretical Bounds</div>
                            <div class="bounds-grid">
                                ${formattedData.bounds.hod1std ? `
                                <div class="bound-item">
                                    <div class="bound-label">HOD 1σ</div>
                                    <div class="bound-value green">$${formattedData.bounds.hod1std.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">LOD 1σ</div>
                                    <div class="bound-value red">$${formattedData.bounds.lod1std.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">HOD 2σ</div>
                                    <div class="bound-value green">$${formattedData.bounds.hod2std.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">LOD 2σ</div>
                                    <div class="bound-value red">$${formattedData.bounds.lod2std.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">HOD 3σ</div>
                                    <div class="bound-value green">$${formattedData.bounds.hod3std.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">LOD 3σ</div>
                                    <div class="bound-value red">$${formattedData.bounds.lod3std.toFixed(2)}</div>
                                </div>
                                ` : ''}
                                <div class="bound-item">
                                    <div class="bound-label">Pre-market HOD</div>
                                    <div class="bound-value">$${formattedData.bounds.hodPM.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">Pre-market LOD</div>
                                    <div class="bound-value">$${formattedData.bounds.lodPM.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">Intraday HOD</div>
                                    <div class="bound-value">$${formattedData.bounds.hodID.toFixed(2)}</div>
                                </div>
                                <div class="bound-item">
                                    <div class="bound-label">Intraday LOD</div>
                                    <div class="bound-value">$${formattedData.bounds.lodID.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>

                        <div class="lstm-forecast-levels">
                            <div class="levels-header">Levels Detected</div>
                            <div class="levels-grid">
                                <div class="level-type">HDBSCAN: ${formattedData.levels.hdbscan}</div>
                                <div class="level-type">OPTICS: ${formattedData.levels.optics}</div>
                                <div class="level-type">Interaction: ${formattedData.levels.interaction}</div>
                                <div class="level-type">ML-Confluence: ${formattedData.levels.ml_confluence}</div>
                                <div class="level-type">Multiscale: ${formattedData.levels.multiscale}</div>
                                <div class="level-type">Neural Net: ${formattedData.levels.neural_network}</div>
                            </div>
                            ${(() => {
                                const allLevels = formattedData.allLevels || [];
                                const cp = formattedData.currentPrice || 0;
                                const resistance = allLevels.filter(l => (l.price || 0) > cp);
                                const support = allLevels.filter(l => (l.price || 0) <= cp);
                                const renderRow = (l, type) => {
                                    const dist = cp ? (((l.price - cp) / cp) * 100).toFixed(2) : '0.00';
                                    const color = type === 'resistance' ? '#6fcf97' : '#eb5757';
                                    const str = l.strength ? (typeof l.strength === 'number' && l.strength <= 1 ? (l.strength * 100).toFixed(0) + '%' : Math.round(l.strength) + '%') : '—';
                                    return `<div class="level-row"><span class="level-row-price" style="color:${color}">$${l.price.toFixed(2)}</span><span class="level-row-type">${l.type || l.category || ''}</span><span class="level-row-str">${str}</span><span class="level-row-dist" style="color:${parseFloat(dist) >= 0 ? '#6fcf97' : '#eb5757'}">${parseFloat(dist) >= 0 ? '+' : ''}${dist}%</span></div>`;
                                };
                                let html = '';
                                if (resistance.length > 0) {
                                    html += `<div class="level-list-section"><div class="level-list-header">Resistance (${resistance.length})</div>${resistance.slice(0, 15).map(l => renderRow(l, 'resistance')).join('')}</div>`;
                                }
                                if (support.length > 0) {
                                    html += `<div class="level-list-section"><div class="level-list-header">Support (${support.length})</div>${support.slice(0, 15).map(l => renderRow(l, 'support')).join('')}</div>`;
                                }
                                return html;
                            })()}
                        </div>

                        ${formattedData.attention && formattedData.attention.weights ? `
                            <div class="lstm-forecast-attention">

                                    Most important bar: ${formattedData.attention.most_important_bar}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
        }

        // ===== NHP Rendering =====
        function renderNhpSection(nhp) {
            if (!nhp || !nhp.success) return '';
            const summary = nhp.summary || {};
            const signals = nhp.signals || [];
            const trained = nhp.model_trained;
            const lastSignals = signals.slice(-10);
            const statusColor = trained ? '#6fcf97' : '#c9a227';
            const statusText = trained ? 'Trained' : 'Price-Driven';

            const signalRows = lastSignals.map(s => {
                const cls = s.signal === 'ENTER' ? 'enter' : s.signal === 'EXIT' ? 'exit' : 'hold';
                return `<div class="nhp-signal-row">
                    <span class="nhp-signal-tag ${cls}">${s.signal}</span>
                    <span class="nhp-stat">bar ${s.bar_index}</span>
                    <span class="nhp-stat">\u03bb=${s.lambda_t.toFixed(3)}</span>
                    <span class="nhp-stat">${(s.confidence * 100).toFixed(0)}%</span>
                </div>`;
            }).join('');

            return `
                <div class="nhp-section">
                    <div class="nhp-section-header">
                        <div>
                            <span class="nhp-section-title">Neural Hawkes Process</span>
                            <span class="nhp-status-badge" style="color:${statusColor};border:1px solid ${statusColor}33;">${statusText}</span>
                        </div>
                        <span class="nhp-bars-label">${nhp.bars || '?'} bars</span>
                    </div>
                    <div class="nhp-intensity-chart">
                        <canvas id="nhpCanvas"></canvas>
                    </div>
                    <div class="nhp-summary-grid">
                        <div class="metric">
                            <div class="metric-label">Mean \u03bb</div>
                            <div class="metric-value">${summary.mean_intensity?.toFixed(3) || '?'}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Max \u03bb</div>
                            <div class="metric-value">${summary.max_intensity?.toFixed(3) || '?'}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Std \u03bb</div>
                            <div class="metric-value">${summary.std_intensity?.toFixed(3) || '?'}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Enter</div>
                            <div class="metric-value" style="color:#6fcf97">${summary.n_enter_signals ?? 0}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Exit</div>
                            <div class="metric-value" style="color:#eb5757">${summary.n_exit_signals ?? 0}</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Total</div>
                            <div class="metric-value">${summary.n_total_signals ?? 0}</div>
                        </div>
                    </div>
                    ${lastSignals.length > 0 ? `
                        <div class="nhp-signals-list">
                            <div style="font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(201,162,39,0.5);margin-bottom:8px;">Recent Signals (last ${lastSignals.length})</div>
                            ${signalRows}
                        </div>
                    ` : ''}
                </div>`;
        }

        function drawNhpChart(nhp) {
            const canvas = document.getElementById('nhpCanvas');
            if (!canvas || !nhp || !nhp.intensity_values) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const W = rect.width, H = rect.height;

            const vals = nhp.intensity_values;
            const n = vals.length;
            if (n < 2) return;

            const maxV = Math.max(...vals) || 1;
            const minV = Math.min(...vals);
            const range = maxV - minV || 1;

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, 'rgba(201, 162, 39, 0.15)');
            grad.addColorStop(1, 'rgba(201, 162, 39, 0.01)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            for (let i = 0; i < n; i++) {
                const x = (i / (n - 1)) * W;
                const y = H - ((vals[i] - minV) / range) * (H - 16) - 8;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = 'rgba(201, 162, 39, 0.7)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let i = 0; i < n; i++) {
                const x = (i / (n - 1)) * W;
                const y = H - ((vals[i] - minV) / range) * (H - 16) - 8;
                i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.stroke();

            (nhp.signals || []).forEach(s => {
                const barIdx = s.bar_index || 0;
                const x = n > 1 ? (barIdx / (n - 1)) * W : W / 2;
                const color = s.signal === 'ENTER' ? '#6fcf97' : s.signal === 'EXIT' ? '#eb5757' : 'rgba(201,162,39,0.3)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = color;
                ctx.font = '9px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(s.signal === 'HOLD' ? '' : s.signal, x, 10);
            });
        }

        // ===== Retry wrapper for Render cold starts =====
        async function fetchWithRetry(url, options = {}, retries = 3, delay = 3000) {
            for (let i = 0; i < retries; i++) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 60000);
                    const resp = await fetch(url, { ...options, signal: controller.signal });
                    clearTimeout(timeout);
                    if (resp.ok || resp.status < 500) return resp;
                    if (i < retries - 1) await new Promise(r => setTimeout(r, delay));
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, delay));
                }
            }
        }

        // ===== Login =====
        const API_BASE = 'https://fartpie.onrender.com';
        const loginOverlay = document.getElementById('loginOverlay');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        loginBtn.addEventListener('click', doLogin);
        document.getElementById('login-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        async function doLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            if (!username || !password) {
                loginError.textContent = 'Please enter username and password';
                return;
            }
            loginBtn.disabled = true;
            loginError.textContent = 'Connecting...';
            try {
                const resp = await fetchWithRetry(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await resp.json();
                if (data.success) {
                    loginOverlay.classList.add('hidden');
                } else {
                    loginError.textContent = data.message || 'Invalid credentials';
                }
            } catch (err) {
                loginError.textContent = 'Connection failed — server may be starting up, try again';
            } finally {
                loginBtn.disabled = false;
            }
        }

        // ===== Forecast =====
        const forecast = new LSTMForecast();
        const container = document.getElementById('forecastContainer');
        const btn = document.getElementById('getForecast');

        btn.addEventListener('click', async () => {
            const ticker = document.getElementById('ticker').value.trim();
            const timeframe = document.getElementById('timeframe').value;
            const lookback = 20;

            if (!ticker) {
                alert('Please enter a ticker symbol');
                return;
            }

            btn.disabled = true;
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Analyzing... (server may take a moment to wake up)</p>
                </div>
            `;

            try {
                forecast.apiBaseUrl = API_BASE;
                const data = await forecast.getForecast(ticker, timeframe, lookback);
                const formatted = forecast.formatForecast(data);
                forecast.renderForecast(formatted, container);

                // Fetch NHP signals and render on the left side
                const nhpContainer = document.getElementById('nhpContainer');
                try {
                    const nhpResp = await fetchWithRetry(`${API_BASE}/api/nhp-signals?ticker=${encodeURIComponent(ticker)}&timeframe=${encodeURIComponent(timeframe)}`, {
                        credentials: 'include'
                    });
                    if (nhpResp.ok) {
                        const nhpData = await nhpResp.json();
                        if (nhpData.success) {
                            nhpContainer.innerHTML = renderNhpSection(nhpData);
                            requestAnimationFrame(() => drawNhpChart(nhpData));
                        }
                    }
                } catch (nhpErr) {
                    console.warn('NHP fetch failed:', nhpErr);
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="lstm-forecast-error">
                        <h3>Error</h3>
                        <p>${error.message}</p>
                        <p class="suggestion">The server may be waking up — try again in a few seconds.</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
            }
        });
        // ===== Tab Switching =====
        const navLinks = document.querySelectorAll('.nav-links a[data-tab]');
        const forecastPanel = document.querySelector('.forecast-panel:not(.backtest-panel)');
        const backtestPanel = document.getElementById('backtestPanel');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                const tab = link.dataset.tab;
                if (tab === 'backtest') {
                    forecastPanel.style.display = 'none';
                    backtestPanel.style.display = 'block';
                } else {
                    forecastPanel.style.display = 'block';
                    backtestPanel.style.display = 'none';
                }
            });
        });

        // ===== Backtest Engine =====
        const BT_COLORS = {
            green: '#22c55e', red: '#ef4444', amber: '#f59e0b',
            blue: '#3b82f6', purple: '#8b5cf6', teal: '#14b8a6'
        };

        function simulateTrades(data, levels, splitIdx, slPct, tpPct) {
            const trades = [];
            const tolerance = 0.003; // 0.3% zone around level

            for (const level of levels) {
                const price = level.price;
                const slDist = price * (slPct / 100);
                const tpDist = price * (tpPct / 100);
                let cooldown = 0;

                for (let i = splitIdx; i < data.length; i++) {
                    if (cooldown > 0) { cooldown--; continue; }
                    const bar = data[i];

                    // Price touches the level (low reaches within tolerance)
                    if (bar.low <= price * (1 + tolerance) && bar.low >= price * (1 - tolerance * 3)) {
                        const entryPrice = price;
                        const slPrice = entryPrice - slDist;
                        const tpPrice = entryPrice + tpDist;
                        let result = null;
                        let exitIdx = i;
                        let exitPrice = entryPrice;

                        for (let j = i + 1; j < data.length; j++) {
                            if (data[j].low <= slPrice) {
                                result = 'loss';
                                exitIdx = j;
                                exitPrice = slPrice;
                                break;
                            }
                            if (data[j].high >= tpPrice) {
                                result = 'win';
                                exitIdx = j;
                                exitPrice = tpPrice;
                                break;
                            }
                        }

                        if (result) {
                            trades.push({
                                level: price,
                                entryIdx: i,
                                entryDate: bar.date,
                                exitIdx,
                                exitDate: data[exitIdx].date,
                                entryPrice,
                                exitPrice,
                                result,
                                pnlPct: ((exitPrice - entryPrice) / entryPrice * 100),
                                barsHeld: exitIdx - i
                            });
                        }
                        cooldown = 3; // skip next 3 bars to avoid repeat entries
                    }
                }
            }
            return trades;
        }

        function renderBacktestResults(data, levels, trades, splitIdx, method, slPct, tpPct) {
            const container = document.getElementById('backtestContainer');
            const interval = document.getElementById('bt-interval').value;
            const tfLabels = {'5m':'5min','15m':'15min','1h':'1H','4h':'4H','1d':'Daily','1wk':'Weekly'};
            const tfLabel = tfLabels[interval] || interval;
            const methodLabels = {
                hdbscan:'HDBSCAN', optics:'OPTICS', kde:'KDE', multiscale:'Multiscale HDBSCAN',
                neural_network:'Neural Network', wyckoff:'Wyckoff', ml_confluence:'ML Confluence',
                interaction:'Interaction', pivot:'Pivots', gap:'Gaps'
            };

            const wins = trades.filter(t => t.result === 'win');
            const losses = trades.filter(t => t.result === 'loss');
            const winRate = trades.length > 0 ? wins.length / trades.length : 0;
            const avgWin = wins.length > 0 ? wins.reduce((s, t) => s + t.pnlPct, 0) / wins.length : 0;
            const avgLoss = losses.length > 0 ? losses.reduce((s, t) => s + t.pnlPct, 0) / losses.length : 0;
            const totalPnl = trades.reduce((s, t) => s + t.pnlPct, 0);
            const expectancy = trades.length > 0 ? totalPnl / trades.length : 0;
            const avgBars = trades.length > 0 ? trades.reduce((s, t) => s + t.barsHeld, 0) / trades.length : 0;
            const profitFactor = Math.abs(avgLoss) > 0 ? (wins.length * avgWin) / (losses.length * Math.abs(avgLoss)) : wins.length > 0 ? Infinity : 0;

            // Per-level breakdown
            const byLevel = {};
            for (const lv of levels) {
                byLevel[lv.price] = { price: lv.price, type: lv.type, trades: [], wins: 0, losses: 0 };
            }
            for (const t of trades) {
                if (byLevel[t.level]) {
                    byLevel[t.level].trades.push(t);
                    if (t.result === 'win') byLevel[t.level].wins++;
                    else byLevel[t.level].losses++;
                }
            }

            let html = `
                <div class="bt-controls">
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">Method</span>
                            <span class="bt-control-value">${methodLabels[method] || method}</span>
                        </div>
                    </div>
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">Levels found</span>
                            <span class="bt-control-value">${levels.length}</span>
                        </div>
                    </div>
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">SL / TP</span>
                            <span class="bt-control-value">${slPct}% / ${tpPct}%</span>
                        </div>
                    </div>
                    <div class="bt-control">
                        <div class="bt-control-header">
                            <span class="bt-control-label">Train / Test</span>
                            <span class="bt-control-value">${splitIdx} / ${data.length - splitIdx} bars</span>
                        </div>
                    </div>
                </div>`;

            // Aggregate stats
            const wrColor = winRate >= 0.55 ? BT_COLORS.green : winRate >= 0.4 ? BT_COLORS.amber : BT_COLORS.red;
            const pfColor = profitFactor >= 1.5 ? BT_COLORS.green : profitFactor >= 1 ? BT_COLORS.amber : BT_COLORS.red;
            const expColor = expectancy > 0 ? BT_COLORS.green : BT_COLORS.red;

            html += `
                <div class="bt-detail">
                    <div class="bt-detail-header">
                        <span class="bt-detail-price">${methodLabels[method] || method}</span>
                        <span class="bt-badge" style="border:1px solid ${wrColor};color:${wrColor}">${(winRate * 100).toFixed(1)}% WIN RATE</span>
                        <span class="bt-badge" style="border:1px solid ${BT_COLORS.blue};color:${BT_COLORS.blue}">${trades.length} TRADES</span>
                        <span class="bt-detail-meta">out-of-sample on ${data.length - splitIdx} bars &middot; ${tfLabel}</span>
                    </div>
                    <div class="bt-detail-body">
                        <div class="bt-detail-left">
                            <div class="bt-section-label">TRADE RESULTS</div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Total trades</span>
                                <span class="bt-stat-value">${trades.length}</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Wins</span>
                                <span class="bt-stat-value" style="color:${BT_COLORS.green}">${wins.length}</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Losses</span>
                                <span class="bt-stat-value" style="color:${BT_COLORS.red}">${losses.length}</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Win rate</span>
                                <span class="bt-stat-value" style="color:${wrColor}">${(winRate * 100).toFixed(1)}%</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Avg win</span>
                                <span class="bt-stat-value" style="color:${BT_COLORS.green}">+${avgWin.toFixed(2)}%</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Avg loss</span>
                                <span class="bt-stat-value" style="color:${BT_COLORS.red}">${avgLoss.toFixed(2)}%</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Expectancy</span>
                                <span class="bt-stat-value" style="color:${expColor}">${expectancy >= 0 ? '+' : ''}${expectancy.toFixed(2)}%<span class="bt-stat-sub">per trade</span></span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Profit factor</span>
                                <span class="bt-stat-value" style="color:${pfColor}">${profitFactor === Infinity ? '∞' : profitFactor.toFixed(2)}</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Total P&L</span>
                                <span class="bt-stat-value" style="color:${totalPnl >= 0 ? BT_COLORS.green : BT_COLORS.red}">${totalPnl >= 0 ? '+' : ''}${totalPnl.toFixed(2)}%</span>
                            </div>
                            <div class="bt-stat-row">
                                <span class="bt-stat-label">Avg bars held</span>
                                <span class="bt-stat-value">${avgBars.toFixed(1)}</span>
                            </div>
                        </div>
                        <div class="bt-detail-right">
                            <div class="bt-section-label">PER-LEVEL BREAKDOWN</div>
                            ${Object.values(byLevel).map(lv => {
                                const lvTotal = lv.trades.length;
                                const lvWr = lvTotal > 0 ? lv.wins / lvTotal : 0;
                                const lvColor = lvWr >= 0.55 ? BT_COLORS.green : lvWr >= 0.4 ? BT_COLORS.amber : BT_COLORS.red;
                                return `
                                    <div style="margin-bottom:8px;padding:8px;background:rgba(255,255,255,0.02);border-radius:3px">
                                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                                            <span style="font-weight:500;font-size:13px">$${lv.price.toFixed(2)}</span>
                                            <span style="font-size:11px;color:rgba(255,255,255,0.4)">${lv.type || ''}</span>
                                        </div>
                                        <div style="display:flex;gap:12px;font-size:11px">
                                            <span>${lvTotal} trade${lvTotal !== 1 ? 's' : ''}</span>
                                            <span style="color:${BT_COLORS.green}">${lv.wins}W</span>
                                            <span style="color:${BT_COLORS.red}">${lv.losses}L</span>
                                            <span style="color:${lvColor}">${(lvWr * 100).toFixed(0)}%</span>
                                        </div>
                                        <div class="bt-score-bar" style="margin-top:4px"><div class="bt-score-fill" style="width:${lvWr * 100}%;background:${lvColor}"></div></div>
                                    </div>`;
                            }).join('')}
                            <div style="margin-top:16px">
                                <div class="bt-section-label">DATA INTEGRITY</div>
                                <div class="bt-interp">
                                    Levels detected on first ${splitIdx} bars (training). Trades simulated on last ${data.length - splitIdx} bars (test). No data leakage — levels never see test data.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;

            // Trade log
            if (trades.length > 0) {
                html += `<div style="margin-top:16px"><div class="bt-section-label" style="padding:0 4px;margin-bottom:8px">TRADE LOG (last 20)</div>`;
                html += `<div style="overflow-x:auto"><table style="width:100%;font-size:11px;border-collapse:collapse">
                    <tr style="color:rgba(255,255,255,0.4);text-align:left">
                        <th style="padding:4px 8px">Level</th><th style="padding:4px 8px">Entry</th><th style="padding:4px 8px">Exit</th>
                        <th style="padding:4px 8px">Result</th><th style="padding:4px 8px">P&L</th><th style="padding:4px 8px">Bars</th>
                    </tr>`;
                trades.slice(-20).forEach(t => {
                    const rc = t.result === 'win' ? BT_COLORS.green : BT_COLORS.red;
                    html += `<tr style="border-top:1px solid rgba(255,255,255,0.04)">
                        <td style="padding:4px 8px">$${t.level.toFixed(2)}</td>
                        <td style="padding:4px 8px">${t.entryDate}</td>
                        <td style="padding:4px 8px">${t.exitDate}</td>
                        <td style="padding:4px 8px;color:${rc}">${t.result.toUpperCase()}</td>
                        <td style="padding:4px 8px;color:${rc}">${t.pnlPct >= 0 ? '+' : ''}${t.pnlPct.toFixed(2)}%</td>
                        <td style="padding:4px 8px">${t.barsHeld}</td>
                    </tr>`;
                });
                html += `</table></div></div>`;
            }

            html += `<div class="bt-footer">yfinance OHLCV &middot; ${data.length} bars &middot; ${tfLabel} &middot; ${methodLabels[method] || method} &middot; ${splitIdx}/${data.length - splitIdx} train/test split &middot; no data leakage</div>`;
            container.innerHTML = html;
        }

        // Backtest button handler
        document.getElementById('runBacktest').addEventListener('click', async () => {
            const ticker = document.getElementById('bt-ticker').value.trim();
            const period = document.getElementById('bt-period').value;
            const interval = document.getElementById('bt-interval').value;
            const method = document.getElementById('bt-method').value;
            const slPct = parseFloat(document.getElementById('bt-sl').value) || 1;
            const tpPct = parseFloat(document.getElementById('bt-tp').value) || 2;
            const btBtn = document.getElementById('runBacktest');
            const btContainer = document.getElementById('backtestContainer');

            if (!ticker) { alert('Please enter a ticker symbol'); return; }

            btBtn.disabled = true;
            btContainer.innerHTML = `<div class="loading"><div class="spinner"></div><p>Running ${method} on ${ticker} ${interval} data...</p></div>`;

            try {
                const url = new URL('https://fartpie.onrender.com/api/backtest-levels');
                url.searchParams.set('ticker', ticker);
                url.searchParams.set('period', period);
                url.searchParams.set('interval', interval);
                url.searchParams.set('method', method);

                const response = await fetch(url.toString());
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || `HTTP ${response.status}`);
                }

                const result = await response.json();
                const data = result.data;
                const levels = result.levels;
                const splitIdx = result.split_idx;

                if (!levels || levels.length === 0) {
                    btContainer.innerHTML = `<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.5);">No levels detected by ${method} on the training data. Try a different method or longer period.</div>`;
                    return;
                }

                const trades = simulateTrades(data, levels, splitIdx, slPct, tpPct);
                renderBacktestResults(data, levels, trades, splitIdx, method, slPct, tpPct);
            } catch (error) {
                btContainer.innerHTML = `<div class="lstm-forecast-error"><h3>Error</h3><p>${error.message}</p></div>`;
            } finally {
                btBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
